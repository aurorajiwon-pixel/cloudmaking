<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구름 관찰 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
*{box-sizing:border-box}
:root{--cream:#fff8e7;--ch:#2b2b2b;--peach:#ffd9c2;--mint:#d4f0dc;--sky:#d6e9ff;--lemon:#fff0a6;--dz:#ffc93c}
body{margin:0;background:var(--cream);color:var(--ch);font-family:'Gowun Dodum',sans-serif;font-size:18px;line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,.logo,.btn,.chip,.st b{font-family:'Jua',sans-serif;font-weight:400}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.nav{background:var(--cream);border-bottom:3px solid var(--ch);position:sticky;top:0;z-index:5}
.nav .wrap{display:flex;justify-content:space-between;align-items:center;min-height:60px;gap:12px}
.logo{font-size:24px}.who{font-size:15px}
#sync{font-size:14px}
.sec{padding:34px 0;border-bottom:3px solid var(--ch)}
.s1{background:var(--lemon)}.s2{background:var(--sky)}.s3{background:var(--mint)}.s4{background:var(--peach)}.s5{background:var(--lemon)}.s0{background:var(--sky)}
h2{font-size:clamp(28px,4vw,40px);margin:0 0 6px;line-height:1.2}
.eyebrow{display:inline-block;background:#fff;border:3px solid var(--ch);border-radius:100px;padding:0 14px;font-size:15px;margin:0 0 12px;box-shadow:3px 3px 0 var(--ch);font-family:'Jua'}
.card{background:#fff;border:3px solid var(--ch);border-radius:24px;padding:20px 22px;box-shadow:5px 5px 0 var(--ch);margin:18px 0}
.card h3{font-size:22px;margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.chip{border:3px solid var(--ch);border-radius:100px;padding:6px 18px;background:#fff;cursor:pointer;font-size:18px;box-shadow:3px 3px 0 var(--ch)}
.chip.on{background:var(--dz)}
.chip:disabled{cursor:default;opacity:.85}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;border:3px solid var(--ch);border-radius:16px;padding:8px 12px;background:#fff;color:var(--ch)}
textarea{min-height:76px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;border:3px solid var(--ch);border-radius:100px;padding:10px 26px;font-size:20px;background:var(--dz);color:var(--ch);box-shadow:5px 5px 0 var(--ch);cursor:pointer;margin-top:12px}
.btn:disabled{background:#fff;cursor:default;opacity:.7}
.lock{text-align:center;padding:24px 0;font-family:'Jua';font-size:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:15px;margin-top:8px}
.nums label{display:block}
.done{font-size:15px;margin-top:8px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .card{margin:0}
.blank{display:inline-block;min-width:96px}
.blank select{width:auto;display:inline-block;padding:2px 8px;border-radius:12px}
.start{max-width:520px;margin:40px auto}
.gbox{margin-top:12px;border:3px dashed var(--ch);border-radius:18px;padding:12px 14px;background:var(--cream)}
.gbox canvas{width:100%;height:240px;display:block;background:#fff;border:3px solid var(--ch);border-radius:14px;margin-top:8px}
.gbox .sum{font-size:15px;margin-top:6px}
.gbox .rd{font-size:14px;margin-top:4px;min-height:22px}
.pts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pts .chip{font-size:16px;padding:4px 14px}
.ptq{background:#fff;border:3px solid var(--ch);border-radius:18px;padding:12px 14px;margin-top:10px}
.ptq b{font-family:'Jua';font-weight:400;font-size:19px}
.ptq .val{font-size:15px;margin-top:6px;background:var(--lemon);border-radius:12px;padding:6px 10px;display:none}
.gbox input[type=file]{font-size:15px}
.mini{padding:4px 14px;font-size:16px;margin-top:8px}
.fb{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;border:3px solid var(--ch);border-radius:24px;box-shadow:5px 5px 0 var(--ch);padding:14px 20px;max-width:560px;width:calc(100% - 32px);display:none;z-index:9}
.fb.on{display:block}
@media(max-width:640px){.row,.cmp{grid-template-columns:1fr}.nums{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><div class="logo">구름 관찰 노트</div><div class="who" id="who"></div><div id="sync"></div></div></header>

<section class="sec s0" id="startSec"><div class="wrap"><div class="card start">
  <h3>시작하기</h3>
  <div class="row"><label>반<input id="inCls" type="text" placeholder="예: 2-3"></label><label>번호<input id="inNum" type="number" min="1" max="40"></label></div>
  <div class="row" style="margin-top:8px"><label>이름<input id="inName" type="text"></label><label>모둠<select id="inGrp"><option value="">고르기</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div>
  <div id="startMsg" style="color:#b33;font-size:15px;margin-top:6px"></div>
  <button class="btn" id="btnStart">시작</button>
</div></div></section>

<main id="main" hidden>
<section class="sec s1"><div class="wrap">
  <span class="eyebrow">1 · 먼저 예측해요</span><h2>실험 전에, 내 생각은?</h2>
  <div id="p1"></div>
</div></section>
<section class="sec s2"><div class="wrap">
  <span class="eyebrow">2 · 관찰 기록</span><h2>실험에서 본 것</h2>
  <div id="p2"></div>
</div></section>
<section class="sec s3"><div class="wrap">
  <span class="eyebrow">3 · 규칙 찾기</span><h2>모든 모둠에 공통인 규칙은?</h2>
  <div id="p3"></div>
</div></section>
<section class="sec s4"><div class="wrap">
  <span class="eyebrow">4 · 다시 생각하기</span><h2>처음 생각과 지금 생각</h2>
  <div id="p4"></div>
</div></section>
</main>
<div class="fb" id="fbBox"><b style="font-family:Jua">선생님 한마디</b><div id="fbText"></div><button class="btn" id="fbOk" style="padding:4px 18px;font-size:17px">확인</button></div>

<script>
/* ===== Firebase 설정 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCmdo6XSf8Hu62aPZezynd9WoEMsj5mc5M",
  authDomain: "cloud-9e6ad.firebaseapp.com",
  projectId: "cloud-9e6ad",
  storageBucket: "cloud-9e6ad.firebasestorage.app",
  messagingSenderId: "469082804294",
  appId: "1:469082804294:web:9487ba98a3af97b6493a47"
};
const FB={apiKey:firebaseConfig.apiKey,projectId:firebaseConfig.projectId,col:'cloud1',ctrl:'cloud1_ctrl/state'};
const FB_ON=!!FB.apiKey&&!/^여기/.test(FB.apiKey);
const $=id=>document.getElementById(id);
const KEY='cloud1_state';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){S={};}
let STAGE=+(S.stage||1);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ===== 선택지 ===== */
const TEMP=['올라간다','그대로다','내려간다'];
const DIR=['올라감','거의 그대로','내려감'];
const SEE=['뿌옇게 흐려짐','변화 없음','흐려졌던 것이 사라짐'];
const BLANKS=[
 ['b1','공기 펌프를 눌러 압력을 가하면 페트병 안의 온도가',['증가','감소'],'한다.'],
 ['b2','뚜껑을 열어 압력이 감소하면 페트병 안의 온도가',['증가','감소'],'한다.'],
 ['b3','이때 온도가 감소하며 상대 습도가',['증가','감소'],'하며,'],
 ['b4','포화되기',['쉬워','어려워'],'진다.']];

/* ===== 그리기 ===== */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chips(name,list,val,dis){return `<div class="opts">${list.map(o=>`<button type="button" class="chip${val===o?' on':''}" data-n="${name}" data-v="${esc(o)}" ${dis?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;}
function lockBox(n){return `<div class="card lock">선생님이 ${n}단계를 열면 시작해요</div>`;}

/* ===== CSV 그래프 ===== */
function gbox(k){return `<div class="gbox"><b style="font-family:Jua">내 측정 파일로 그래프 그리기</b> <span style="font-size:14px">(다운로드한 data-press_temp-1.csv)</span><br>
  <input type="file" accept=".csv,text/csv" data-csv="${k}"><canvas id="cv_${k}" width="760" height="240" hidden></canvas>
  <div class="rd" id="rd_${k}">그래프 위에 마우스를 올리거나 손가락으로 누르면 그 순간의 값이 보여요.</div>
  ${k==='e'?`<label style="font-size:15px;display:none" id="zw_e"><input type="checkbox" id="zoom_e"> 뚜껑을 연 순간 크게 보기</label>`:''}
  <div class="sum" id="sum_${k}"></div><div id="pt_${k}"></div></div>`;}
const RAW={},RUNS={},RUNI={};
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return null;
  const sp=l=>l.split(/[,;\t]/).map(x=>x.trim().replace(/^"|"$/g,''));
  const isNum=c=>c.length>=3&&c.slice(0,3).every(x=>x!==''&&isFinite(+x));
  let head=[];const first=sp(lines[0]);if(!isNum(first))head=first.map(h=>h.toLowerCase());
  const find=(re,d)=>{const i=head.findIndex(h=>re.test(h));return i<0?d:i;};
  const it=find(/time|시간/,0),ip=find(/press|기압|압력/,1),iT=find(/temp|온도|기온/,2);
  // 피코는 '기존 데이터 삭제'를 누르지 않으면 측정을 이어 붙이므로, 시간이 0으로 돌아가는 곳에서 측정을 나눈다
  const runs=[];let cur=null,prev=Infinity;
  for(const l of lines){const c=sp(l);if(!isNum(c))continue;const a=+c[it],b=+c[ip],d=+c[iT];
    if(!cur||a<prev){cur={t:[],p:[],T:[]};runs.push(cur);}cur.t.push(a);cur.p.push(b);cur.T.push(d);prev=a;}
  const ok=runs.filter(r=>r.t.length>=10);if(!ok.length)return null;
  const ms=/ms/.test(head[it]||'')||Math.max(...ok.map(r=>r.t[r.t.length-1]))>1000;
  return ok.map(r=>{const t0=r.t[0];return{t:r.t.map(x=>ms?(x-t0)/1000:x-t0),p:r.p,T:r.T};});}
const mean=(a,i,j)=>{i=Math.max(0,i);j=Math.min(a.length,j);let s=0,n=0;for(let k=i;k<j;k++){s+=a[k];n++;}return n?s/n:NaN;};
function idxAt(t,sec){let i=0;while(i<t.length&&t[i]<sec)i++;return i;}
function analyze(k,d){const n=d.t.length,dt=(d.t[n-1]-d.t[0])/(n-1)||0.01,per=s=>Math.max(1,Math.round(s/dt));
  if(k==='c'){const a=per(1);const p0=mean(d.p,0,a),p1=mean(d.p,n-a,n),T0=mean(d.T,0,a);let im=0;for(let i=0;i<n;i++)if(d.T[i]>d.T[im])im=i;
    return{p0,p1,T0,T1:d.T[im],ev:null,msg:`압축 측정을 읽었어요 (${d.t.length}개 값, ${d.t[d.t.length-1].toFixed(1)}초). 아래 짚어 볼 곳을 하나씩 눌러 보세요.`};}
  const w=per(0.2);let ev=0,best=Infinity;for(let i=0;i+w<n;i++){const v=d.p[i+w]-d.p[i];if(v<best){best=v;ev=i;}}
  const h=per(0.5),p0=mean(d.p,ev-h,ev),p1=mean(d.p,ev+per(1),ev+per(1.5)),T0=mean(d.T,ev-h,ev);
  let T1=Infinity;for(let i=ev;i<Math.min(n,ev+per(3));i++)T1=Math.min(T1,d.T[i]);
  return{p0,p1,T0,T1,ev,msg:`뚜껑을 연 때로 보이는 순간: ${d.t[ev].toFixed(1)}초 (노란 선). 아래 짚어 볼 곳을 하나씩 눌러 보세요.`};}
function down(d,m=150){const n=d.t.length,st=Math.max(1,Math.ceil(n/m)),o={t:[],p:[],T:[]};for(let i=0;i<n;i+=st){o.t.push(+d.t[i].toFixed(2));o.p.push(+mean(d.p,i,i+st).toFixed(2));o.T.push(+mean(d.T,i,i+st).toFixed(3));}return o;}
function points(k,d){const n=d.t.length,dt=(d.t[n-1]-d.t[0])/(n-1)||0.01,per=s=>Math.max(1,Math.round(s/dt)),t=d.t,f=(v,x=2)=>v.toFixed(x);
  if(k==='e'){const a=analyze(k,d),ev=a.ev;let im=ev;for(let i=ev;i<Math.min(n,ev+per(3));i++)if(d.T[i]<d.T[im])im=i;
    const b0=Math.max(0,ev-per(3)),Tb0=mean(d.T,b0,b0+per(0.5)),Tb1=a.T0,ir=Math.min(n-1,im+per(5));
    return[
     {name:'뚜껑을 열기 전',hl:[{band:[t[b0],t[ev]]}],q:'뚜껑을 열기 전 3초 동안, 기압과 온도는 어떻게 변하고 있었나요? (거의 일정 / 서서히 오름 / 서서히 내림)',
      val:`기압 ${f(mean(d.p,b0,b0+per(0.5)),1)} → ${f(a.p0,1)} hPa · 온도 ${f(Tb0)} → ${f(Tb1)} °C`},
     {name:'뚜껑을 연 순간',hl:[{line:t[ev]}],q:'노란 선에서 기압과 온도는 각각 어떻게 변했나요? 어느 쪽이 더 갑자기 변했나요?',
      val:`기압 ${f(a.p0,1)} → ${f(a.p1,1)} hPa (${f(a.p1-a.p0,1)}) · 온도 ${f(a.T0)} → ${f(a.T1)} °C (${f(a.T1-a.T0)})`},
     {name:'온도가 가장 낮은 곳',hl:[{line:t[ev]},{dot:[t[im],d.T[im]]}],q:'뚜껑을 연 뒤 몇 초 만에 온도가 가장 낮아졌나요? 바로 낮아지지 않았다면 왜 그럴까요?',
      val:`뚜껑을 연 뒤 ${f(t[im]-t[ev],1)}초 · 가장 낮은 온도 ${f(d.T[im])} °C`},
     {name:'그 뒤 5초',hl:[{band:[t[im],t[ir]]}],q:'가장 낮아진 뒤 온도는 어떻게 되나요? 병 속 공기는 무엇과 열을 주고받았을까요?',
      val:`${f(d.T[im])} → ${f(d.T[ir])} °C (5초 동안 ${f(d.T[ir]-d.T[im])} °C)`}];}
  const a1=per(1),p0=mean(d.p,0,a1);let is=n-1;for(let i=0;i<n;i++)if(d.p[i]>p0+3){is=i;break;}
  let ipm=0,iTm=0;for(let i=0;i<n;i++){if(d.p[i]>d.p[ipm])ipm=i;if(d.T[i]>d.T[iTm])iTm=i;}
  let ipl=ipm;for(let i=is;i<n;i++)if(d.p[i]>=p0+(d.p[ipm]-p0)*0.98){ipl=i;break;}
  return[
   {name:'펌프를 누르기 시작한 때',hl:[{line:t[is]}],q:'기압이 올라가기 시작할 때, 온도는 어떻게 되기 시작하나요?',
    val:`${f(t[is],1)}초 · 기압 ${f(p0,1)} hPa · 온도 ${f(mean(d.T,0,a1))} °C`},
   {name:'기압이 가장 높을 때',hl:[{dot:[t[ipm],d.p[ipm]],ax:'p'}],q:'기압은 얼마까지 올라갔나요? 처음보다 얼마나 높아졌나요?',
    val:`${f(t[ipm],1)}초 · ${f(d.p[ipm],1)} hPa (처음보다 +${f(d.p[ipm]-p0,1)})`},
   {name:'온도가 가장 높을 때',hl:[{dot:[t[iTm],d.T[iTm]]},{line:t[ipl]}],q:'온도가 가장 높았던 때는 펌프를 멈춘 때(노란 선)와 같은가요, 다른가요?',
    val:`온도 최고 ${f(t[iTm],1)}초 · ${f(d.T[iTm])} °C · 펌프를 멈춘 때 ${f(t[ipl],1)}초`},
   {name:'펌프를 멈춘 뒤',hl:[{band:[t[ipl],t[n-1]]}],q:'기압은 거의 그대로인데 온도는 어떻게 되나요? 왜 그럴까요?',
    val:`기압 ${f(d.p[ipl],1)} → ${f(d.p[n-1],1)} hPa · 온도 ${f(d.T[ipl])} → ${f(d.T[n-1])} °C`}];}
function drawChart(cv,d,hl){const ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return;
  const W=cv.width=cv.clientWidth*2||760,H=cv.height=480,L=110,R=110,Tp=50,B=70;ctx.clearRect(0,0,W,H);ctx.font='22px Gowun Dodum, sans-serif';
  const ext=a=>{let lo=Math.min(...a),hi=Math.max(...a);if(hi-lo<1e-6){lo-=0.5;hi+=0.5;}const pad=(hi-lo)*0.08;return[lo-pad,hi+pad];};
  const [t0,t1]=[d.t[0],d.t[d.t.length-1]],[p0,p1]=ext(d.p),[T0,T1]=ext(d.T);
  const X=t=>L+(t-t0)/(t1-t0||1)*(W-L-R),Yp=v=>Tp+(1-(v-p0)/(p1-p0))*(H-Tp-B),YT=v=>Tp+(1-(v-T0)/(T1-T0))*(H-Tp-B);
  cv._geo={L,R,W,t0,t1,d};
  (hl||[]).forEach(h=>{if(h.band){const a=Math.max(t0,h.band[0]),b=Math.min(t1,h.band[1]);if(b>a){ctx.fillStyle='rgba(255,201,60,0.28)';ctx.fillRect(X(a),Tp,X(b)-X(a),H-Tp-B);}}});
  ctx.strokeStyle='#ddd';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=Tp+i*(H-Tp-B)/4;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();
    ctx.fillStyle='#c0392b';ctx.textAlign='right';ctx.fillText((p1-i*(p1-p0)/4).toFixed(0),L-10,y+8);ctx.fillStyle='#1f5fbf';ctx.textAlign='left';ctx.fillText((T1-i*(T1-T0)/4).toFixed(2),W-R+10,y+8);}
  ctx.fillStyle='#2b2b2b';ctx.textAlign='center';for(let i=0;i<=5;i++){const t=t0+i*(t1-t0)/5;ctx.fillText(t.toFixed(1),X(t),H-B+32);}ctx.fillText('시간(초)',W/2,H-8);
  ctx.textAlign='left';ctx.fillStyle='#c0392b';ctx.fillText('■ 기압(hPa)',L,24);ctx.fillStyle='#1f5fbf';ctx.fillText('■ 온도(°C)',L+180,24);
  (hl||[]).forEach(h=>{if(h.line!=null&&h.line>=t0&&h.line<=t1){ctx.strokeStyle='#ffc93c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(X(h.line),Tp);ctx.lineTo(X(h.line),H-B);ctx.stroke();}});
  const line=(a,Y,c)=>{ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();a.forEach((v,i)=>{const x=X(d.t[i]),y=Y(v);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();};
  line(d.p,Yp,'#c0392b');line(d.T,YT,'#1f5fbf');
  (hl||[]).forEach(h=>{if(h.dot&&h.dot[0]>=t0&&h.dot[0]<=t1){const y=h.ax==='p'?Yp(h.dot[1]):YT(h.dot[1]);ctx.fillStyle='#ffc93c';ctx.strokeStyle='#2b2b2b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(X(h.dot[0]),y,14,0,7);ctx.fill();ctx.stroke();}});
  if(cv._cross!=null){const x=cv._cross;ctx.strokeStyle='#2b2b2b';ctx.setLineDash([8,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,Tp);ctx.lineTo(x,H-B);ctx.stroke();ctx.setLineDash([]);}}
const PT={},PTI={};
function readout(cv,k,ev){const g=cv._geo;if(!g)return;const r=cv.getBoundingClientRect();const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const W2=r.width;
  const x=cx/W2*g.W;if(x<g.L||x>g.W-g.R)return;const tt=g.t0+(x-g.L)/(g.W-g.L-g.R)*(g.t1-g.t0);const i=Math.min(g.d.t.length-1,idxAt(g.d.t,tt));
  cv._cross=x;drawChart(cv,g.d,cv._hl);$('rd_'+k).textContent=`${g.d.t[i].toFixed(2)}초 · 기압 ${g.d.p[i].toFixed(1)} hPa · 온도 ${g.d.T[i].toFixed(2)} °C`;}
function showGraph(k){const d=RAW[k]||(D.obs&&D.obs['g'+k]);const cv=$('cv_'+k);if(!d||!cv)return;cv.hidden=false;

    $('sum_'+k).innerHTML=pick+esc(a.msg)+` <button class="btn mini" data-fill="${k}">다 짚어 봤으면, 숫자 칸 채우기</button>`;
    const rs=document.querySelector(`select[data-run="${k}"]`);if(rs)rs.onchange=()=>{RUNI[k]=+rs.value;RAW[k]=RUNS[k][RUNI[k]];D.obs['g'+k]=down(RAW[k]);PTI[k]=null;showGraph(k);};

      (sel!=null?`<div class="ptq"><b>${sel+1} · ${esc(PT[k][sel].name)}</b><div>${esc(PT[k][sel].q)}</div><textarea data-note="${k}|${sel}" placeholder="그래프를 보고 내가 읽은 것">${esc(notes[sel]||'')}</textarea><button type="button" class="btn mini" data-val="${k}">값 확인하기</button><div class="val" id="val_${k}">${esc(PT[k][sel].val)}</div></div>`:'<div style="font-size:15px;margin-top:6px">번호를 누르면 그래프에 그곳이 표시돼요. 먼저 그래프를 보고 내 말로 쓴 다음, 값을 확인해요.</div>');
    document.querySelectorAll(`[data-pt^="${k}|"]`).forEach(b=>b.onclick=()=>{const i=+b.dataset.pt.split('|')[1];PTI[k]=PTI[k]===i?null:i;showGraph(k);});
    const ta=document.querySelector(`[data-note^="${k}|"]`);if(ta)ta.oninput=()=>{notes[sel]=ta.value;};
    const vb=document.querySelector(`[data-val="${k}"]`);if(vb)vb.onclick=()=>{if(!(notes[sel]||'').trim()){alert('먼저 그래프를 보고 내가 읽은 것을 써 보세요.');return;}$('val_'+k).style.display='block';};}
  else $('sum_'+k).textContent='저장해 둔 그래프예요. 짚어 볼 곳과 숫자를 다시 보려면 파일을 다시 올려요.';
  cv._hl=hl;cv._cross=null;drawChart(cv,view,hl);
  cv.onmousemove=e=>readout(cv,k,e);cv.ontouchstart=cv.ontouchmove=e=>{readout(cv,k,e);};
  const fb=document.querySelector(`[data-fill="${k}"]`);if(fb)fb.onclick=()=>{const a=analyze(k,RAW[k]);const pre=k==='c'?'c':'e';
    D.obs[pre+'p0']=+a.p0.toFixed(1);D.obs[pre+'p1']=+a.p1.toFixed(1);D.obs[pre+'t0']=+a.T0.toFixed(2);D.obs[pre+'t1']=+a.T1.toFixed(2);
    ['p0','p1','t0','t1'].forEach(x=>{const el=document.querySelector(`input[data-k="${pre+x}"]`);if(el)el.value=D.obs[pre+x];});};}

function bind(){
  document.querySelectorAll('.chip:not([disabled])').forEach(b=>b.onclick=()=>{const n=b.dataset.n,v=b.dataset.v;
    const tgt=['c','e'].includes(n)?D.pred:['qc','qe'].includes(n)?D.post:D.obs;tgt[n]=v;
    b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));});
  document.querySelectorAll('#p2 input[data-k]').forEach(i=>i.oninput=()=>{D.obs[i.dataset.k]=i.value===''?null:+i.value;});
  document.querySelectorAll('#p4 select[data-b]').forEach(s=>s.onchange=()=>{D.post.blank[s.dataset.b]=s.value;});

    const r=new FileReader();r.onload=()=>{const runs=parseCSV(String(r.result));if(!runs){$('sum_'+k).textContent='이 파일에서 시간·기압·온도 값을 찾지 못했어요. 다운로드한 CSV 파일이 맞는지 확인해요.';return;}
      RUNS[k]=runs;RUNI[k]=runs.length-1;RAW[k]=runs[RUNI[k]];D.obs['g'+k]=down(RAW[k]);showGraph(k);};r.readAsText(f);});

  B('btnPred',()=>{const p=D.pred;p.cr=$('cr').value.trim();p.er=$('er').value.trim();p.see=$('see').value.trim();
    if(!p.c||!p.e){alert('①, ②의 선택지를 골라 주세요.');return;}
    S.pred={...p,at:Date.now()};save();sync();render();});
  B('btnObs',()=>{const o=D.obs;o.memo=$('memo').value.trim();
    if(!o.cp||!o.ct||!o.ep||!o.et||!o.so){alert('화살표와 눈으로 본 것을 골라 주세요.');return;}

/* ===== Firestore ===== */
function toV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toV)}};return{mapValue:{fields:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,toV(x)]))}};}
function fromV(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return +v.integerValue;if('doubleValue'in v)return v.doubleValue;
  if('booleanValue'in v)return v.booleanValue;if('arrayValue'in v)return(v.arrayValue.values||[]).map(fromV);
  if('mapValue'in v)return Object.fromEntries(Object.entries(v.mapValue.fields||{}).map(([k,x])=>[k,fromV(x)]));return null;}
let AU=null;
async function authed(){
  if(AU&&AU.exp>Date.now()+60000)return AU;
  if(!AU){try{AU=JSON.parse(localStorage.getItem('cloud1_auth')||'null');}catch(e){AU=null;}}
  if(AU&&AU.exp>Date.now()+60000)return AU;
  if(AU&&AU.refresh){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AU.refresh)});
    if(r.ok){const j=await r.json();AU={id:j.id_token,refresh:j.refresh_token,uid:j.user_id,exp:Date.now()+(+j.expires_in)*1000};}else AU=null;}
  if(!AU||!AU.id){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok)throw new Error('auth '+r.status);const j=await r.json();AU={id:j.idToken,refresh:j.refreshToken,uid:j.localId,exp:Date.now()+(+j.expiresIn)*1000};}
  try{localStorage.setItem('cloud1_auth',JSON.stringify(AU));}catch(e){}
  return AU;}
const ROOT=()=>`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/`;
let syncT=null,busy=false,again=false;
function sync(){if(!FB_ON||!S.name)return;clearTimeout(syncT);syncT=setTimeout(flush,80);}
async function flush(){if(busy){again=true;return;}busy=true;
  try{await authed();
    const data={cls:S.cls,num:S.num,name:S.name,grp:S.grp,pred:S.pred||null,obs:S.obs||null,rule:S.rule||null,post:S.post||null,updated:Date.now()};
    const mask=Object.keys(data).map(k=>'updateMask.fieldPaths='+k).join('&');
    const r=await fetch(ROOT()+FB.col+'/'+AU.uid+'?'+mask,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+AU.id},body:JSON.stringify({fields:Object.fromEntries(Object.entries(data).map(([k,v])=>[k,toV(v)]))})});
    if(!r.ok)throw new Error('save '+r.status);setSync(1);
  }catch(e){setSync(0);clearTimeout(syncT);syncT=setTimeout(flush,8000);}
  busy=false;if(again){again=false;flush();}}
function setSync(ok){$('sync').textContent=!FB_ON?'⚪ 저장만(연결 꺼짐)':ok?'🟢 선생님과 연결됨':'🟠 인터넷 연결을 기다리는 중 · 기록은 이 노트북에 저장돼요';}
async function poll(){if(!FB_ON||!S.name)return;
  try{await authed();
    const r=await fetch(ROOT()+FB.ctrl,{headers:{Authorization:'Bearer '+AU.id}});
    if(r.ok){const j=await r.json();const st=j.fields&&j.fields.stage?fromV(j.fields.stage):1;if(st!==STAGE){STAGE=st;S.stage=st;save();render();}}
    const f=await fetch(ROOT()+FB.col+'/'+AU.uid+'?mask.fieldPaths=fb',{headers:{Authorization:'Bearer '+AU.id}});
    if(f.ok){const j=await f.json();const fb=j.fields&&j.fields.fb?fromV(j.fields.fb):null;if(fb&&fb.at>(S.fbSeen||0)){$('fbText').textContent=fb.t;$('fbBox').classList.add('on');$('fbBox').dataset.at=fb.at;}}
    if(S.name)setSync(1);
  }catch(e){setSync(0);}}
$('fbOk').onclick=()=>{S.fbSeen=+$('fbBox').dataset.at;save();$('fbBox').classList.remove('on');};

/* ===== 시작 ===== */
function enter(){$('startSec').hidden=true;$('main').hidden=false;render();sync();poll();}
$('btnStart').onclick=()=>{const c=$('inCls').value.trim(),n=+$('inNum').value,m=$('inName').value.trim(),g=$('inGrp').value;
  if(!c||!n||!m||!g){$('startMsg').textContent='반, 번호, 이름, 모둠을 모두 써 주세요.';return;}
  S.cls=c;S.num=n;S.name=m;S.grp=+g;save();enter();};
setSync(1);
if(S.name)enter();
setInterval(()=>{if(!document.hidden)poll();},5000);
</script>
